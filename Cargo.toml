[package]
name = "gdext_coroutines"
version = "0.0.0"
authors = ["Houtamelo", "miruji"]
edition = "2024"
description = "Run Rust Async functions and Coroutines in Godot 4.2+ (through GDExtension), inspired on Unity's Coroutines design."
license = "MIT"
readme = "README.md"

autobins = false
autoexamples = false
autotests = false
autobenches = false

publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
godot = {git = "https://github.com/godot-rust/gdext", branch = "master", features = ["experimental-threads"]}
smol = { version = "2.0", optional = true }

[features]
default = []
async = ["dep:smol"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
overflow-checks = false
debug  = false
incremental = true
rpath = false

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
lto = false
incremental = true
